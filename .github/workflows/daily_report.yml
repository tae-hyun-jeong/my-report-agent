name: Daily Battery & AI Report

on:
  schedule:
    # [예시 1] 한국 시간(KST) 매일 아침 07:45 실행 (UTC 22:45) - 추천!
    - cron: '45 22 * * *'
    
    # [예시 2] 한국 시간(KST) 매일 아침 08:15 실행 (UTC 23:15)
    # - cron: '15 23 * * *'
  workflow_dispatch:

jobs:
  daily-job:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 리포트 생성 및 텔레그램 발송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python report.py
